---
- name: Установка Filebeat
  hosts: webservers
  become: yes
  gather_facts: true

  tasks:
    - name: Установка wget
      apt:
        name: wget
        state: present
        update_cache: no

    - name: Скачивание Filebeat
      get_url:
        url: "https://mirror.yandex.ru/mirrors/elastic/7/pool/main/f/filebeat/filebeat-7.17.27-amd64.deb"
        dest: /tmp/filebeat.deb

    - name: Установка Filebeat
      apt:
        deb: /tmp/filebeat.deb

    - name: Создание конфига
      copy:
        dest: /etc/filebeat/filebeat.yml
        content: |
          filebeat.inputs:
          - type: log
            enabled: true
            paths:
              - /var/log/nginx/access.log
              - /var/log/nginx/error.log

          output.elasticsearch:
            hosts: ["10.3.0.100:9200"]

          setup.kibana:
            host: "10.4.0.100:5601"
        owner: root
        group: root
        mode: '0644'

    - name: Перезагрузка systemd
      systemd:
        daemon_reload: yes

    - name: Запуск Filebeat
      service:
        name: filebeat
        state: restarted
        enabled: yes