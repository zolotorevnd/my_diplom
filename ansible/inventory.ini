ansible_ssh_private_key_file = ~/.ssh/id_ed25519
ansible_ssh_extra_args = -o StrictHostKeyChecking=no

[bastion]
bastion ansible_host=130.193.36.111

[webservers]
web-1 ansible_host=web-1.ru-central1.internal ansible_ssh_common_args='-o ProxyCommand="ssh -W %h:%p -p 22 zolotorev@130.193.36.111"'
web-2 ansible_host=web-2.ru-central1.internal ansible_ssh_common_args='-o ProxyCommand="ssh -W %h:%p -p 22 zolotorev@130.193.36.111"'
